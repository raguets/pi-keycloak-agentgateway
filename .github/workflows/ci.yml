name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run bundle:offline
      - uses: actions/upload-artifact@v4
        with:
          name: pi-keycloak-agentgateway-${{ matrix.os }}-node${{ matrix.node }}
          path: artifacts/*
  pi-versions:
    # Full suite against every supported Pi 1.x release (list in src/compat.ts).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:pi-versions
